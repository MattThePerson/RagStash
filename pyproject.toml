[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ragstash"
version = "0.0.1"
description = "CLI tool to help retrieve RAG context from a corpus of documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "typed-argument-parser>=1.12.0",
]

[project.scripts]
ragstash = "ragstash.cli:main"
