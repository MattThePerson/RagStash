[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ragstash"
version = "0.1.2"
description = "CLI tool to help retrieve RAG context from a corpus of documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "sentence-transformers>=5.5.1",
    "sqlite-vec>=0.1.9",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.12.1",
    "flask>=3.1.3",
    "typed-argument-parser>=1.12.0",
]
urls = { "Homepage" = "https://github.com/MattThePerson/RagStash" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
ragstash = "ragstash.app:main"
